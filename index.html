<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneStop Hub Engineering</title>
    <meta name="description" content="Dasbor terintegrasi untuk mengelola semua pintasan aplikasi web, direktori drive lokal (seperti Drive D:, C:), dan pengelompokan kategori kerja maupun pribadi secara praktis." />
    <meta property="og:title" content="OneStop Hub Engineering" />
    <meta property="og:description" content="Dasbor terintegrasi untuk mengelola semua pintasan aplikasi web, direktori drive lokal (seperti Drive D:, C:), dan pengelompokan kategori kerja maupun pribadi secara praktis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('onestop_hub_theme_v1');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedUiStyle = localStorage.getItem('onestop_hub_ui_style_v1');
          document.documentElement.dataset.uiStyle = savedUiStyle === 'classic' ? 'classic' : 'clay';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
